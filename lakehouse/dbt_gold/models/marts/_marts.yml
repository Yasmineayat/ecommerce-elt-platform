version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_key
        tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: dim_sellers
    columns:
      - name: seller_key
        tests: [unique, not_null]
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
  - name: fct_order_items
    columns:
      - name: order_item_key
        tests: [unique, not_null]
