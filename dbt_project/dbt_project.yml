on-run-start:
  - "create or replace macro initcap(s) as array_to_string(list_transform(string_split(lower(s), ' '), w -> upper(w[1:1]) || w[2:]), ' ')"
name: ecommerce
version: "1.0.0"
profile: ecommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  ecommerce:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts